name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Lint YAML
        run: find .github -name '*.yml' -print0 | xargs -0 npx --yes yaml-lint

      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if grep -rInE '^(<{7}|={7}|>{7})' --exclude-dir=.git .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Validate repo structure
        run: |
          for f in README.md LICENSE .gitignore; do
            [ -f "$f" ] || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
