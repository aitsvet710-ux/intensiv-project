name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Lint YAML
        run: find .github -name '*.yml' -print0 | xargs -0 npx --yes yaml-lint

      - name: Check whitespace and conflict markers
        run: |
          git diff --check
          if grep -rInE '^(<{7}|={7}|>{7})' --exclude-dir=.git .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Validate repo structure
        run: |
          for f in README.md LICENSE .gitignore AGENTS.md data/materials.json; do
            [ -f "$f" ] || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
